apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placement-ingress
  namespace: placement
  annotations:
    # NGINX Ingress Controller for Kind
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120s"
spec:
  ingressClassName: nginx
  rules:
    - host: sabyasachisaha.portal.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080
