kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
    extraMounts:
      - hostPath: /var/lib/placement/storage
        containerPath: /var/lib/placement/storage
  - role: worker
    extraMounts:
      - hostPath: /var/lib/placement/storage
        containerPath: /var/lib/placement/storage
