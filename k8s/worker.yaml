apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: placement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: zorochuro1234/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: placement-config
            - secretRef:
                name: placement-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        # Shared hostPath volume — same path as API deployment
        - name: storage
          hostPath:
            path: /var/lib/placement/storage
            type: DirectoryOrCreate
