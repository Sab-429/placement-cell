apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: placement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/placement-worker:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: placement-config
            - secretRef:
                name: placement-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis,os; redis.from_url(os.getenv('REDIS_URL','redis://redis-service:6379/0')).ping()"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis,os; redis.from_url(os.getenv('REDIS_URL','redis://redis-service:6379/0')).ping()"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        # Shared hostPath volume — same path as API deployment
        - name: storage
          hostPath:
            path: /var/lib/placement/storage
            type: DirectoryOrCreate
