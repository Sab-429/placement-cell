apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: placement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: zorochuro1234/placement-backend:localv3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: placement-config
            - secretRef:
                name: placement-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        # Shared hostPath volume — API and Worker both read/write here
        # so resume PDFs generated by Worker are downloadable via API.
        - name: storage
          hostPath:
            path: /var/lib/placement/storage
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: placement
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
