apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: placement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/placement-backend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: placement-config
            - secretRef:
                name: placement-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      hostAliases:
        # Required when PostgreSQL is external (running on EC2, not in K8s)
        # Replace <EC2_PRIVATE_IP> with your EC2's actual private IP:
        #   curl -s http://169.254.169.254/latest/meta-data/local-ipv4
        - ip: "${EC2_PRIVATE_IP}"
          hostnames:
            - "postgres"
            - "postgres-service"
      volumes:
        # Shared hostPath volume — API and Worker both read/write here
        # so resume PDFs generated by Worker are downloadable via API.
        - name: storage
          hostPath:
            path: /var/lib/placement/storage
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: placement
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
