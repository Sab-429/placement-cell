name: CI - Build & Push to Amazon ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new push arrives.
# This ensures only the latest commit builds, preventing mid-build cancellations
# from GitHub queueing multiple runs and killing the active one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_BACKEND: placement-backend
  ECR_REPOSITORY_WORKER: placement-worker
  ECR_REPOSITORY_FRONTEND: placement-frontend
  GITOPS_REPO: https://github.com/Sab-429/placement-gitops.git

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only configure AWS and push on push to main, not on PRs
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract short git SHA for consistent image tagging across all 3 services
      - name: Get short git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Build & push Backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.sha_short }}
          # Use registry cache (ECR inline) instead of type=gha.
          # On self-hosted runners, type=gha hits GitHub's artifact cache service over the
          # internet and causes SSL timeouts; registry cache stays within AWS and is faster.
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:cache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build & push Worker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WORKER }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WORKER }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.sha_short }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WORKER }}:cache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WORKER }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build & push Frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.sha_short }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:cache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Write image tag to file (for CD workflow)
        if: github.event_name == 'push'
        run: |
          echo "${{ steps.vars.outputs.sha_short }}" > /tmp/image-tag.txt
          echo "IMAGE_TAG=${{ steps.vars.outputs.sha_short }}" >> $GITHUB_ENV

      - name: Upload image tag artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: /tmp/image-tag.txt
          retention-days: 7

      # ── GitOps: Update image tags in GitOps repository ─────────────────
      - name: Update GitOps repo with new image tags
        if: github.event_name == 'push'
        run: |
          git config --global user.name "${{ secrets.GITOPS_USER }}"
          git config --global user.email "${{ secrets.GITOPS_USER_EMAIL }}"

          git clone https://${{ secrets.GITOPS_PAT }}@github.com/Sab-429/placement-gitops.git /tmp/gitops-repo
          cd /tmp/gitops-repo

          # Update image tags in kustomization.yaml
          sed -i 's/newTag: "IMAGE_TAG_PLACEHOLDER"/newTag: "${{ steps.vars.outputs.sha_short }}"/g' overlays/production/kustomization.yaml

          git add overlays/production/kustomization.yaml
          git commit -m "Update image tags to ${{ steps.vars.outputs.sha_short }}"

          git push origin main
