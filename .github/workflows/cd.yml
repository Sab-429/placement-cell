name: CD - Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build & Push to Amazon ECR"]
    branches: [main]
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: placement
  NAMESPACE: placement

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Set IMAGE_TAG from workflow run SHA
        run: |
          IMAGE_TAG=$(git rev-parse --short ${{ github.event.workflow_run.head_sha }})
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Using image tag: $IMAGE_TAG"

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install envsubst
        run: |
          sudo apt-get update -y && sudo apt-get install -y gettext-base

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Apply namespace first
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create ECR pull secret in K8s
        run: |
          aws ecr get-authorization-token --region ${{ env.AWS_REGION }} --output text \
            --query 'authorizationData[].authorizationToken' | head -1 | base64 -d | cut -d: -f2 > /tmp/ecr-password.txt
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=${{ steps.account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password="$(cat /tmp/ecr-password.txt)" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute env vars in K8s manifests
        run: |
          export AWS_ACCOUNT_ID=${{ steps.account.outputs.account_id }}
          export AWS_REGION=${{ env.AWS_REGION }}
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          for f in k8s/api.yaml k8s/worker.yaml k8s/frontend.yaml; do
            envsubst < "$f" > "/tmp/$(basename $f)"
            kubectl apply -f "/tmp/$(basename $f)"
          done

      - name: Apply remaining K8s manifests
        run: |
          kubectl apply -f k8s/configmap.yaml

          # Create/update secrets from GitHub Secrets (never committed to repo)
          kubectl create secret generic placement-secrets \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Rollout status
        run: |
          kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/worker -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
