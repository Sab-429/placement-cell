name: CD — Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI — Build & Push to Amazon ECR"]
    branches: [main]
    types:
      - completed

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: placement
  NAMESPACE: placement

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assign: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # If you prefer static keys instead of OIDC, uncomment below:
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Download image tag artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tag
          path: /tmp

      - name: Set IMAGE_TAG from artifact
        run: |
          IMAGE_TAG=$(cat /tmp/image-tag.txt | head -1 | sed 's/.*://')
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Using image tag: $IMAGE_TAG"

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Set up kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Create ECR pull secret in K8s
        run: |
          aws ecr get-authorization-token --region ${{ env.AWS_REGION }} --output text \
            --query 'authorizationData[].authorizationToken' | head -1 | base64 -d | cut -d: -f2 > /tmp/ecr-password.txt
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password="$(cat /tmp/ecr-password.txt)" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          # Apply namespace, configmap, and infrastructure first
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

          # Create/update secrets from GitHub Secrets (never committed to repo)
          kubectl create secret generic placement-secrets \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Apply applications
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/api.yaml
          kubectl apply -f k8s/worker.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update image tags to ECR
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          kubectl set image deployment/api api="${ECR_REGISTRY}/placement-backend:${{ env.IMAGE_TAG }}" -n ${{ env.NAMESPACE }}
          kubectl set image deployment/worker worker="${ECR_REGISTRY}/placement-worker:${{ env.IMAGE_TAG }}" -n ${{ env.NAMESPACE }}
          kubectl set image deployment/frontend frontend="${ECR_REGISTRY}/placement-frontend:${{ env.IMAGE_TAG }}" -n ${{ env.NAMESPACE }}

      - name: Rollout status
        run: |
          kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/worker -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}